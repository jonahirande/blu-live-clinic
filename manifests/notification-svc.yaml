apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-config
  namespace: blu-live-clinic
data:
  SMTP_HOST: "smtp.gmail.com" 
  SMTP_PORT: "465"
  PORT: "5001"
---
apiVersion: v1
kind: Secret
metadata:
  name: notification-secrets
  namespace: blu-live-clinic
type: Opaque
stringData:
  SMTP_USER: "jonahure4u@gmail.com"
  SMTP_PASS: "ljlajmhravagwoqe"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: notification-data
  namespace: blu-live-clinic
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: notification-svc
  namespace: blu-live-clinic
spec:
  type: ClusterIP
  ports:
    - port: 5001
      protocol: TCP
      targetPort: 5001
  selector:
    app: notification-svc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-svc
  namespace: blu-live-clinic
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-svc
  template:
    metadata:
      labels:
        app: notification-svc
    spec:
      containers:
        - name: notification-svc
          image: irandejonah/blu-live-clinic-notification:v1.0.33
          imagePullPolicy: Always
          ports:
            - containerPort: 5001
          envFrom:
            - configMapRef:
                name: notification-config
            - secretRef:
                name: notification-secrets
