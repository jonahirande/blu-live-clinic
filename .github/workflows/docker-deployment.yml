name: Create and Push to Docker

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

# Grant write permissions so the git push to main succeeds
permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      TAG: ${{ steps.set-version.outputs.TAG }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Semantic Version
        id: set-version
        run: |
          # Calculate patch version starting from 0 (1.0.0 on run 1)
          PATCH=$(( ${{ github.run_number }} - 1 ))
          TAG="v1.0.${PATCH}"
          
          echo "Calculated Version Tag: $TAG"
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Images
        run: |
          echo "Building images with tag: ${{ env.IMAGE_TAG }}"
          
          docker build -t ${{ secrets.DOCKER_USERNAME }}/blu-live-clinic-frontend:${{ env.IMAGE_TAG }} ./frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/blu-live-clinic-frontend:${{ env.IMAGE_TAG }}

          docker build -t ${{ secrets.DOCKER_USERNAME }}/blu-live-clinic-backend:${{ env.IMAGE_TAG }} ./backend
          docker push ${{ secrets.DOCKER_USERNAME }}/blu-live-clinic-backend:${{ env.IMAGE_TAG }}

          docker build -t ${{ secrets.DOCKER_USERNAME }}/blu-live-clinic-db:${{ env.IMAGE_TAG }} ./db
          docker push ${{ secrets.DOCKER_USERNAME }}/blu-live-clinic-db:${{ env.IMAGE_TAG }}

          docker build -t ${{ secrets.DOCKER_USERNAME }}/blu-live-clinic-notification:${{ env.IMAGE_TAG }} ./notification-svc
          docker push ${{ secrets.DOCKER_USERNAME }}/blu-live-clinic-notification:${{ env.IMAGE_TAG }}

      - name: Update Kubernetes Manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git fetch origin main
          git reset --hard origin/main

          # Update the tags in the manifest files
          sed -i "s|image: .*frontend:.*|image: ${{ secrets.DOCKER_USERNAME }}/blu-live-clinic-frontend:${{ env.IMAGE_TAG }}|g" manifests/frontend.yaml
          sed -i "s|image: .*backend:.*|image: ${{ secrets.DOCKER_USERNAME }}/blu-live-clinic-backend:${{ env.IMAGE_TAG }}|g" manifests/backend.yaml
          sed -i "s|image: .*db:.*|image: ${{ secrets.DOCKER_USERNAME }}/blu-live-clinic-db:${{ env.IMAGE_TAG }}|g" manifests/db.yaml
          sed -i "s|image: .*notification-svc:.*|image: ${{ secrets.DOCKER_USERNAME }}/blu-live-clinic-notification:${{ env.IMAGE_TAG }}|g" manifests/notification-svc.yaml
          
          # Add, commit, and push
          git add manifests/*.yaml
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore: update images to ${{ env.IMAGE_TAG }} [skip ci]"
            git push origin main
          else
            echo "No changes to manifests. Skipping commit."
          fi

  # ----------------------------------------------------------------  
  # STAGE 2: Deploy Containers Locally (Runs on Self-hosted Machine)
  # ----------------------------------------------------------------
  deploy:
    needs: build-and-push
    runs-on: self-hosted
    env:
      TAG: ${{ needs.build-and-push.outputs.TAG }}
    steps:
      - name: Deploy Containers Locally
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          
          docker pull ${{ secrets.DOCKER_USERNAME }}/blu-live-clinic-backend:$TAG
          docker pull ${{ secrets.DOCKER_USERNAME }}/blu-live-clinic-frontend:$TAG
          docker pull ${{ secrets.DOCKER_USERNAME }}/blu-live-clinic-db:$TAG
          docker pull ${{ secrets.DOCKER_USERNAME }}/blu-live-clinic-notification:$TAG
          
          # Ensure Docker Network Exists
          docker network create --opt com.docker.network.driver.mtu=1400 clinic-network || true
          
          # --- Database Container ---
          #docker stop mongodb || true
          #docker rm mongodb || true
          #docker run -d \
           # --name mongodb \
            #--network clinic-network \
            #--restart always \
            #-v clinic_db_data:/var/lib/mysql \
            #${{ secrets.DOCKER_USERNAME }}/blu-live-clinic-db:$TAG
            
          # --- Backend Container ---
          docker stop clinic-backend || true
          docker rm clinic-backend || true
          docker run -d \
            --name clinic-backend \
            --network clinic-network \
            --restart always \
            -p 5000:5000 \
            ${{ secrets.DOCKER_USERNAME }}/blu-live-clinic-backend:$TAG

          # --- Frontend Container ---
          docker stop clinic-frontend || true
          docker rm clinic-frontend || true
          docker run -d \
            --name clinic-frontend \
            --network clinic-network \
            --restart always \
            -p 8080:80 \
            ${{ secrets.DOCKER_USERNAME }}/blu-live-clinic-frontend:$TAG
          docker stop clinic-notification || true

          docker rm clinic-notification || true
          docker run -d \
            --name clinic-notification \
            --network clinic-network \
            --restart always \
            -p 5001:5001 \
            -e SMTP_HOST="${{ secrets.SMTP_HOST }}" \
            -e SMTP_PORT="${{ secrets.SMTP_PORT }}" \
            -e SMTP_USER="${{ secrets.SMTP_USER }}" \
            -e SMTP_PASS="${{ secrets.SMTP_PASS }}" \
            ${{ secrets.DOCKER_USERNAME }}/blu-live-clinic-notification:$TAG

            # Prune old dangling images
          docker image prune -f
